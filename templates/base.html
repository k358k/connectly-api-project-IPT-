<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Connectly API{% endblock %}</title>
    
    <!-- This is where Google Sign-in setup-->
    <script src="https://accounts.google.com/gsi/client" async></script>
    
    <!-- For fast server response -->
    <script>
        (function() {
            const scripts = document.querySelectorAll('script[src*="accounts.google.com/gsi/client"]');
            scripts.forEach(script => {
                const currentSrc = script.src.split('?')[0];
                script.src = currentSrc + '?t=' + Date.now();
            });
        })();
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        
        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>    
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
